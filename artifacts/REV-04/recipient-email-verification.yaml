# Recipient email verification, the enrichment sidecar for the approved
# message template library.
#
# Population: every contact of an account whose customer relationship
# management status is `target`. The population is derived from the export,
# never typed: a contact_id or an address that does not byte-match its row in
# the export is a defect, not an update.
#
# email_status is what the last enrichment run could say about the address:
#
#   verified  the address was confirmed against the provider on that run.
#   inferred  the address was constructed from the account domain pattern and
#             never confirmed, so the drafter abstains and records the missing
#             input rather than writing to it.
#
# Consent is a separate question with its own source of truth. A permitted
# consent state does not make an inferred address usable, and this file says
# nothing about consent.

