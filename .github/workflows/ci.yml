name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node --test + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm test

      # Checks exactly what MANIFEST.json says this repo ships: every committed
      # dataset regenerates byte-identical, and nothing listed has gone missing.
      # Unbuilt catalog specs are drafts, not regressions, so they are skipped.
      # Run `node datagen/src/cli.js validate --all` locally for the full list.
      - run: npm run validate
