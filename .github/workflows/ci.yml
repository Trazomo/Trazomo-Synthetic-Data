# Every push and every pull request runs what a reviewer would run by hand.
#
# `npm run validate` is `validate --manifest`, not `validate --all`: the
# catalog still carries specs nobody has built, so `--all` is red by design and
# could never gate anything. Manifest mode checks exactly what MANIFEST.json
# says shipped, which is green today and goes red the moment a shipped dataset
# stops reproducing byte for byte or stops existing.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
