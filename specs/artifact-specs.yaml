      - carries the GL side of the FIN-01 planted features (one entry for the duplicated deposit, no entry for the unrecorded bank fee, the transposed vendor payment amount, the deposit in transit dated 2026-03-31) and the twelve FIN-03 outstanding checks
    consuming_modules: [finance-cash-bank-reconciliation]
    source_plan: finance-implementation-plan

