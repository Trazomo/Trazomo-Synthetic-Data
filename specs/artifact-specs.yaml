# Trazomo unified artifact spec catalog
# Version: 2026-08-08 consolidation (seeds datagen and the Trazomo-Synthetic-Data MANIFEST)
#
# Namespace: CORE- (cross-path, 2+ consuming paths), LGL-, FIN-, HR-, REV-, OPS-, SMB-.
# Numbering traceability: LGL-NN = legal coverage matrix A-NN (gaps where promoted);
# OPS-NN = operations plan A-NN; FIN/HR/REV/SMB follow each plan's consolidated list order.
# Promotion aliases: LGL-01 -> CORE-01, LGL-06 -> CORE-02, LGL-19 -> CORE-03, LGL-15 -> CORE-05.
#
# generation: deterministic = seeded templating, planted features injected by the generator.
#             drafted-frozen = LLM-drafted, human-reviewed, frozen; generator validates only.
# canon_entities: co- ids per canon/companies.md (this consolidation's roster).
#                 "co-140+" = the generator-produced CRM/account population range.
# consuming_modules: resolved module slugs per program-consolidation.md Section 1.
#                    Legal slugs are the shipped, grandfathered ones.

artifacts:
  # ----------------------------------------------------------------- CORE
  - id: CORE-01
    name: master-services-agreement
    type: contract
    format: markdown
    generation: drafted-frozen
    canon_entities: [co-002, co-101]
    planted_features:
      - 8+ numbered sections
      - section 6 liability cap variants at 1x, 2x, and 0.5x trailing-12-month fees
      - 90-day auto-renewal notice in section 1 vs 30-day termination notice in section 7 (canon mismatch)
      - section 7 termination for convenience
      - section 8 indemnification (sole-expense and third-party clauses)
      - consequential-damages waiver-only clause
      - "automatic renewal opt-out: 90-day non-renewal deadline, 60-day renewal notice, 30-day late notice void"
      - 7 percent annual payment uplift clause
      - 2,000,000 professional-indemnity insurance figure
      - DPA / data-processing reference and governing-law clause
      - dollar-value variants 450k / 80k / 40k / 20k for tiering exercises
      - annual SaaS subscription schedule (finance amortization source)
      - milestone-gating clause referenced by the operations project brief
    consuming_modules:
      - contract-operating-system
      - contract-review
      - commercial-contract-ops
      - claude-platform
      - codex-gpt-platform
      - crm-integration
      - microsoft-365
      - self-service-portal
      - ai-foundations
      - finance-accruals-and-prepaids
      - operations-brief-to-project-plan
    source_plan: legal-coverage-matrix (A1) + finance-implementation-plan + operations-implementation-plan

