  - id: FIN-04
    name: ar-aging-export
    type: dataset
    format: csv + json
    generation: deterministic
    canon_entities: [co-002, co-102, co-103, co-140+]
    period: { start: "2026-03-01", end: "2026-03-31" }
    columns: [customer_canon_id, customer_name, document_type, document_number, document_date, due_date, terms, original_amount, open_balance, currency, days_past_due, aging_bucket, applied_to_document, ar_owner_employee_id]
    planted_features:
      - "1 invoice in the AR subledger not reflected in GL: the subledger total less the FIN-05 receivable control balance equals exactly one row's open_balance, and no other row in the file carries that value"
      - "1 unapplied customer credit memo: exactly one credit_memo row has an empty applied_to_document, on the customer canon assigns the collections problem; every other credit memo names an invoice of the same customer"
      - aging as of 2026-03-31 over documents dated from 2025-11-14; days_past_due and aging_bucket are both derived from due_date, so a bucket is recomputable rather than a label, and all five buckets (current, 1-30, 31-60, 61-90, 90+) are non-empty
      - document numbers are disjoint from the FIN-02 reference block, because a receipt collected during March cannot still be open at 2026-03-31
      - ar-aging-summary.json carries the as-of date, the receivable control account, per-bucket document counts and totals, and the subledger total; no answers
    consuming_modules: [finance-ar-aging-gl-tie-out, finance-collections-ar-follow-up]
    source_plan: finance-implementation-plan

