      - "pre-close at 2026-03-31, before the FIN-09 batch posts and before the FIN-01 reconciliation adjustments are booked: total ending debits equal total ending credits, exactly one of ending_debit and ending_credit is populated per row, and account 3200 carries the residual"
      - "cross-artifact ties, each recomputed rather than written down: account 1010 equals FIN-02's ending GL cash, account 1100 equals the FIN-04 subledger total less the one unposted invoice, account 2000 equals the FIN-11 bills still open, account 2010 equals the FIN-10 accrual roll-forward closing balance, and accounts 1200 and 1210 carry the two prepaid balances"
    consuming_modules: [finance-ar-aging-gl-tie-out]
    source_plan: finance-implementation-plan

