  # ----------------------------------------------------------------- FIN (finance path)
  # Finance anchor period: March 2026 (canon/timeline.md). FIN-01, FIN-02 and
  # FIN-03 come from one seeded builder (datagen/src/generators/fin-01-cash-recon.js).
  - id: FIN-01
    name: bank-transactions
    type: dataset
    format: csv + json
    generation: deterministic
    canon_entities: [co-002, co-104, co-102, co-105, co-106, co-107, co-109, co-119, co-140+]
    period: { start: "2026-03-01", end: "2026-03-31" }
    columns: [txn_id, posted_date, value_date, description, counterparty, reference, type, amount, running_balance, channel]
    planted_features:
      - "1 duplicated deposit (bank error): one customer receipt posted twice in the bank feed, two txn_ids with the same amount and reference one or two days apart, while the GL records it once; hold for human review, never auto-clear"
      - 2 unmatched payments, each with one root cause. A (unrecorded item) is a bank service fee debit with no GL entry, not yet booked, needs a journal entry. B (amount error) is a vendor ACH debit whose GL entry carries a transposed amount so exact matching fails, a preparer keying error, needs a correcting entry
      - "1 deposit-in-transit timing difference: a customer receipt the GL records on 2026-03-31 that the bank posts on 2026-04-01, so it is absent from the March statement"
      - bank-statement-summary.json carries period, opening balance, ending balance, credit and debit counts and totals; no answers
      - the tie-out holds to the cent, adjusted bank balance = ending balance + deposit in transit - outstanding checks (FIN-03) - duplicated deposit; adjusted book balance = GL ending balance (FIN-02) - unrecorded bank fee + (GL transposed amount - bank amount)
    # Dataset variants (convention added 2026-08-18, datagen/README.md "Dataset
    # variants"): a trimmed slice of this dataset, emitted by this generator,
    # derived from a sibling file by a predicate over that file's own columns.
    # The rule is the contract: a reader re-derives the variant with one filter,
    # and tests re-derive it from the parent rather than trusting the bytes.
    variants:
      - name: ach-receipts-mar-05-06
        file: variants/ach-receipts-mar-05-06.csv
        derived_from: bank-transactions.csv
        rule: 'every parent row with channel == "ach", type == "credit" and posted_date in {2026-03-05, 2026-03-06}, in parent file order, with the parent header'
        consuming_modules: [finance-local-ai]
    consuming_modules: [finance-cash-bank-reconciliation, finance-local-ai]
    source_plan: finance-implementation-plan

  - id: FIN-02
    name: gl-cash-ledger
    type: dataset
    format: csv
    generation: deterministic
    canon_entities: [co-002, co-102, co-105, co-106, co-107, co-109, co-119, co-140+]
    period: { start: "2026-03-01", end: "2026-03-31" }
    columns: [je_id, posting_date, gl_account, description, counterparty, reference, debit, credit, source, prepared_by]
    planted_features:
