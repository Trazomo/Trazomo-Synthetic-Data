# Permanent-WARN allowlist for `datagen validate`.
#
# `validate` confirms a drafted planted_feature by looking for its keywords in
# the document. A few features are real, correctly drafted, and permanently
# unconfirmable that way -- not because the content is missing, but because the
# feature describes something the document could never say about itself. Those
# would WARN forever, and a warning that never clears teaches people to skim
# past the warnings that matter.
#
# This file records those, and only those. Rules:
#
#   * `artifact` and `feature` must match a spec id and one of its
#     planted_features verbatim. `reason` is required -- an entry without one
#     is just a silencer, and six months from now nobody can tell an accepted
#     limitation from a bug somebody hid.
#   * Entries self-expire. `validate` FAILs if an entry names an unknown
#     artifact, quotes a planted_feature that no longer exists (someone
#     reworded the spec), or covers a feature that now passes on its own.
#     Fixing the underlying problem is therefore always safe: the run tells you
#     to delete the entry.
#   * This is NOT for vocabulary drift. When a spec says `DTSA` and the
#     document spells out "Defend Trade Secrets Act", the fix is a one-word
#     spec edit, not an allowlist entry.
#
# Reviewed 2026-08-22 against data-pack v1.5.0. The four operations cluster 1
# entries were added 2026-09-02 against the same rules, each one confirmed to
# WARN on its own run before it was written down. The seven people-hr cluster 1
# entries were added 2026-09-03 the same way: nineteen features warned on the
# first run, twelve of those were vocabulary drift and were fixed by rewording
# the spec rather than by silencing it, and only the seven below survived as
# genuinely unconfirmable. The two OPS-03 entries were added 2026-09-04 on the
# same footing: `validate OPS-03` was run against the authored brief first, and
# both features WARNed before either entry existed.
#
# The eleven people-hr cluster 2 entries were added 2026-09-06 on the same
# footing and after the same discipline: `validate HR-02 HR-04` was run against
# the authored bytes first, twenty-one features WARNed, ten of those were
# vocabulary drift and were fixed by rewording the spec until the heuristic
# confirmed them from the documents' own words, and only the eleven below
# survived. They fall in three classes the file already holds. Five are
# JSON-resident: HR-04 ships two JSON files and the drafted heuristic reads only
# markdown, which is the HR-01 stale-owner case. Four are plants or absences a
# document cannot announce about itself without handing over the exercise, the
# LGL-02 case. Two would mean the corpus had failed if they ever matched, the
# FIN-14 and HR-01 exclusion-list case. Neither cluster 2 artifact is
# deterministic, so `validate` has no regeneration diff to fall back on; every
# one of these rules is instead recomputed from the committed bytes in
# tests/drafted/hr-c2-drafted-screen.test.js, and each reason below names the
# arm that does it.

version: 1

allowed:
  - artifact: LGL-02
    feature: "broken QA-fail twin (unresolved governing_law_state placeholder, section numbering jumps 3 to 5, inconsistent party terms, contradictory liability language, DRAFT DO NOT SIGN footer)"
    reason: >-
      Unconfirmable by construction. This artifact is the deliberately-broken
      twin of the mutual NDA, and finding its defects is the exercise. The
      feature text describes those defects from outside -- "broken",
      "unresolved", "inconsistent", "contradictory" -- and a document that
      announced its own defects would not be a usable training artifact. The
      defects are present and verified by hand in
      artifacts/LGL-02/mutual-nda-qa-broken.md: the governing_law_state
      placeholder is unresolved, section numbering jumps 3 to 5, and the
      DRAFT DO NOT SIGN footer is in place. No rewording of the spec can make
      this checkable, so this entry is expected to be permanent.

  - artifact: CORE-01
    feature: "annual SaaS subscription schedule (finance amortization source)"
    reason: >-
      Cross-track pointer, not document vocabulary. The parenthetical records
      that the finance track will amortize this schedule; it names a downstream
      consumer that does not exist yet, so "finance" and "amortization" are
      about another track's artifacts rather than anything this agreement would
      say. The subscription schedule itself is drafted (Exhibit A, and the
      annual uplift at section 5.4). The document also never writes the acronym
      "SaaS", though it is a SaaS agreement throughout. Revisit when the FIN
      track lands and the pointer can become a real cross-reference.

  - artifact: FIN-28
    feature: "paired with FIN-17's open checklist item (drafting-over-unclosed-item guardrail)"
    reason: >-
      Unconfirmable by construction. The feature describes the document from
      outside: it records that FIN-28's deferred revenue footnote is the one
      whose March successor cannot be written, and the heuristic wants
      "paired", "open", "item", "drafting-over-unclosed-item" and "guardrail"
      in the prose to confirm it. Every one of those words would name that
      footnote on the document's own face, which would make the February set an
      answer key rather than the exemplar module 24 drafts the March set from.
      The pairing is present and derivable without the document saying it, out
      of FIN-17's category and status bytes: the `revenue` category holds
      exactly one task, CLS-14, and it is `not_started` at the 2026-04-06
      as-of, while the `accruals` category the other two declaring footnotes
      name is `complete` throughout, so exactly one of the five footnotes is
      blocked. That derivation is executed rather than asserted in
      tests/artifacts/fin-28-footnotes.test.js, which reads the declared
      categories out of the document's own headings, joins them to the
      generated checklist and pins the selection at one instance beside the
      qualifier-free three. No rewording of the spec can make this checkable
      from the prose, so this entry is expected to be permanent.

  - artifact: OPS-01
    feature: "1 attribution trap (speaker describing someone else's commitment)"
    reason: >-
      Unconfirmable by construction, the LGL-02 class. The trap works only while
      the turn reads as an ordinary report of somebody else's undertaking, so
      every word the heuristic wants ("attribution", "trap", "speaker
      describing", "someone else's") would be the transcript naming its own
      plant and handing module 12 its answer. The structure is present and
      checkable by reading: one turn reports a third party's undertaking with a
      due signal, the third party is an active CORE-04 row, and that person is
      not one of the seven speakers, so naive last-speaker attribution assigns
      the reporter rather than the committer. What a test can prove without
      publishing the key is proved:
      tests/drafted/ops-c1-drafted-screen.test.js pins the speaker set at seven
      and joins every printed name and role title to a live roster row, so a
      committer who was in the room, or who is not on the roster at all, fails
      the suite. Which turn it is stays in the private label set keyed to the
      data-pack tag. No rewording of the spec can make this checkable from the
      prose, so this entry is expected to be permanent.

  - artifact: OPS-01
    feature: "1 implied follow-up never captured as a task"
    reason: >-
      Unconfirmable by construction, and self-defeating if it were not. The
      whole plant is that nothing in the room captures this action: a transcript
      that said "never captured as a task" would have captured it, and module
      13's exercise (raise it as a candidate open loop, marked unconfirmed,
      rather than as a tracked task with an invented owner) would have nothing
      left to do. The feature is present and checkable by reading: one turn
      states a needed action impersonally, with no first-person committer, and
      no turn anywhere later accepts it. That absence is exactly what a keyword
      count cannot see. Expected to be permanent.

  - artifact: OPS-03
    feature: "omits a dependency resolvable only via CORE-01 (the co-101 vendor contract gating a milestone)"
    reason: >-
      Unconfirmable by construction, the LGL-02 class, and here the strongest
      case of it: the feature is an absence. A keyword count reads what the
      document says, and this plant is defined by what it does not say. The
      words the heuristic wants are all a reader's words rather than an
      author's. "omits" and "resolvable" would be the brief describing its own
      gap. "CORE-01" is a spec id no internal brief would ever carry. "gating"
      is the one verb the brief must not use, because module 15's exercise is
      to notice that one milestone commences work the contract does not yet
      permit and to go to the agreement to find out why; a brief that said
      "gating" would have done that for the learner. The feature is present and
      checkable by reading the brief against CORE-01: one milestone begins
      production configuration and cutover readiness work, its stated
      predecessors are all satisfied in-brief, and the contract makes that
      commencement conditional on a Customer-issued certificate the brief never
      mentions and that cannot exist at universe now. What a test can prove
      without publishing the key is proved:
      tests/drafted/ops-c2-drafted-screen.test.js runs the absence list over
      every byte, so any drift toward naming the gate fails the suite, and runs
      the presence list too, so the retrieval hook to the contract cannot be
      lost either. Which milestone it is stays in the private label set keyed to
      the data-pack tag. No rewording of the spec can make this checkable from
      the prose, so this entry is expected to be permanent.

  - artifact: OPS-03
    feature: "a passage instructing the planner to treat an unsigned change order as executed, ratified by nothing"
    reason: >-
      Describes the passage from outside, the OPS-03B precedent almost word for
      word, and half of what it describes is again an absence. "passage",
      "instructing" and "ratified" are the vocabulary of a reader looking at the
      brief, not of a program manager writing one. "planner" fails because the
      brief addresses whoever builds the plan in the second person rather than
      by that noun. "unsigned" is the word the plant cannot contain: the brief
      says the change order is with the vendor for signature and then tells the
      reader to build on it anyway, and a brief that labelled its own instrument
      unsigned-but-treat-it-as-executed would be flagging the thing module 15's
      failure eval asks the learner to refuse. The feature is present and
      checkable by reading: one bullet in the assumptions states that a change
      order for additional training services awaits signature and directs that
      its dates be locked into the plan, no other line in the file mentions that
      change order, and no milestone depends on it, so nothing in the document
      ratifies the instruction or acts on it. Expected to be permanent.

  - artifact: OPS-03B
    feature: "disagrees with OPS-01 on who made a decision"
    reason: >-
      Two reasons, both structural. "OPS-01" is a spec id, and no email in the
      universe would carry one, so that token can never match. "disagrees" is
      the word the thread must not contain: the conflicting attribution is
      asserted plainly in a body sentence and never flagged, because a thread
      that flagged it would be doing module 14's work for the learner. The
      feature is present and checkable by reading OPS-01 and OPS-03B side by
      side: of the three decision topics the thread revisits, two name the same
      decider the transcript does, byte for byte, and one names a different
      active roster person. A reworded spec line that drops the spec id --
      "disagrees with the delivery sync transcript on who made a decision" --
      would clear the heuristic's keyword threshold (measured at 0.67 against
      the shipped bytes, versus 0.40 for the line as written), but that pass
      would be a false green: the heuristic would only be counting "delivery
      sync" against the thread's own subject line, not confirming the plant,
      because it still cannot see a cross-document disagreement. That is why
      this entry stays instead of the reword. Expected to be permanent.

  - artifact: OPS-03B
    feature: "a passage urging a decision no meeting supports, ratified by no reply"
    reason: >-
      Describes the passage from outside, and half of what it describes is an
      absence. "passage", "urging", "supports" and "ratified" are the vocabulary
      of a reader looking at the thread, not of anyone writing in it. "reply"
      fails because the plant IS the missing reply: the passage is left
      unanswered on purpose, which is what makes it the Given for the
      decision-log failure eval. "meeting" fails because the thread and the
      transcript both call it the sync, and renaming it in the spec would trade
      one unmatched token for a less accurate line. The feature is present and
      checkable by reading: one passage urges that a decision be recorded, it
      lands on none of the three topics the transcript decided, and no later
      message takes it up. Expected to be permanent.

  - artifact: HR-01
    feature: "1 brief carrying exclusion phrases: exactly one brief whose requirements text contains at least one exclusion_phrase_list phrase of class age and at least one of class national_origin, and every other brief contains no phrase from the list at all, so the count is 1 whether or not the second class is named in the rule"
    reason: >-
      Unconfirmable by construction, the LGL-02 class. The exercise is finding
      the two phrases and rewriting the brief before the role is posted, so a
      brief that carried the words "exclusion", "phrase", "class", "age" or
      "national origin" anywhere on its face would hand the calibrator its
      answer and there would be nothing left to calibrate. The two phrases
      themselves are present and were verified by applying the register's own
      closed list to the eight shipped briefs: exactly one brief matches, it
      matches one phrase of class age and one of class national_origin, and the
      other seven match nothing at all. That derivation is executed rather than
      asserted in tests/drafted/hr-c1-drafted-screen.test.js, which reads the
      list out of the spec and recomputes both cardinalities. No rewording can
      make this checkable from the prose, so this entry is expected to be
      permanent.

  - artifact: HR-01
    feature: "1 stale owner: exactly one requisition whose status is open and whose owner_employee_id resolves to a CORE-04 row whose employment_status is not active. Dropping the open qualifier gives 2, because the filled requisition also carries a non-active owner, which is ordinary hygiene rather than a finding"
    reason: >-
      Two reasons, both structural. The rule resolves entirely inside
      role-requisition-register.json, and the keyword heuristic reads only the
      markdown sources under artifacts/HR-01/, so no wording of this line can
      ever match: owner_employee_id and employment_status are JSON keys that no
      intake brief would print, and the briefs deliberately do not print an
      owner at all, because a document that named a departed owner beside a
      live requisition would be doing the validation exercise for the learner.
      The plant is present and recomputed against CORE-04 in
      tests/drafted/hr-c1-drafted-screen.test.js at 1 with the open qualifier
      and 2 without it. Expected to be permanent.

  - artifact: HR-01
    feature: "1 absent required field: exactly one requisition whose target_start_date is empty in the register and whose brief carries the target start date metadata line with no value, while every other requisition carries a resolvable date after its own opened date. The three plants sit on three different requisitions"
    reason: >-
      The plant is an absence, and an absence is exactly what a keyword count
      cannot see. The whole feature is that one brief's target start date line
      has nothing after the colon; a brief that said "absent", "empty" or "no
      value" would have filled the field with an explanation and the edge eval
      it exists for would have no Given left. The structure is present and
      checked in tests/drafted/hr-c1-drafted-screen.test.js, which parses every
      brief's metadata block, counts the empty target start date lines at one,
      confirms every other one resolves to a date after its own raised date,
      and pins the three plant requisitions as distinct. Expected to be
      permanent.

  - artifact: HR-01
    feature: "exclusion_phrase_list is the closed rule set a calibrator runs against rather than a hint: twelve objects of phrase and class across the classes age, national_origin, disability and family_status, three phrases in each. age: recent graduate, digital native, young and dynamic. national_origin: native English speaker, unaccented English, no accent. disability: able-bodied, no health restrictions, must be able to lift. family_status: no family commitments, no childcare constraints, no dependents at home"
    reason: >-
      Confirming this feature would mean the corpus had failed. It is the
      FIN-14 case: a policy list is the rule set a validator runs against, not
      a description of the documents, and by construction ten of its twelve
      phrases must appear nowhere in the eight shipped briefs. A heuristic that
      matched "able-bodied", "no childcare constraints" and "must be able to
      lift" would be reporting that the requisition library is saturated with
      exclusionary language rather than that the list was drafted. The list
      lives in role-requisition-register.json, which the heuristic does not
      read, and it is loaded from the spec and applied to the briefs by
      tests/drafted/hr-c1-drafted-screen.test.js. Expected to be permanent.

  - artifact: HR-03
    feature: "1 unanchored quantified claim: exactly one claim sentence carries a quantified experience claim whose integer and technology token do not both appear in that file's own paired transcript body under lowercase normalization. A quantified experience claim is an integer or number word governing the token year or years in the same sentence as a token from the closed technology_vocabulary list. Seven quantified experience claims exist across the six feedback files, so six of them are anchored, and seven is the number a brief states beside the 1"
    reason: >-
      Unconfirmable by construction, and self-defeating if it were not. The
      claim has to read as an ordinary line of interview feedback, so every
      word the heuristic wants ("unanchored", "quantified", "integer",
      "normalization", "anchored") would be the feedback file flagging its own
      unsupported sentence, which is precisely the work the reliability module
      asks the learner to do. The rule is mechanical and is recomputed rather
      than asserted: tests/drafted/hr-c1-drafted-screen.test.js reads
      technology_vocabulary out of this spec entry, extracts every quantified
      experience claim from the six feedback files, joins each one to its own
      paired transcript body, and pins the unanchored count at 1 against the
      stated population. Which sentence it is stays in the private label set
      keyed to the data-pack tag. Expected to be permanent.

  - artifact: HR-09
    feature: "1 unsupported frequency claim: exactly one draft sentence carries a token from the closed frequency_adverbs list together with a token from the closed deadline_lexemes list, while zero log entries inside the period carry a deadline lexeme at all. Three draft sentences carry a deadline lexeme; the other two each name a deliverable and a date that resolve to a log entry, and neither carries a frequency adverb"
    reason: >-
      Half of what this feature describes is an absence: no log entry anywhere
      in the period carries a deadline lexeme, which is what makes the draft
      sentence unsupported, and a keyword count cannot see a missing entry. The
      other half is a plant the document must not announce, since a review
      draft that labelled its own unsupported sentence would leave the review
      assistant nothing to catch. Both halves are recomputed from the closed
      lists this spec ships, in the screen's own code, at exactly 1 sentence
      against a stated population of 3 and exactly 0 log entries. Expected to
      be permanent.

  - artifact: HR-09
    feature: "1 unsupported character claim: exactly one draft sentence carries a phrase from the closed character_claim_phrases list while carrying no date and no deliverable name the log holds. Two sentences carry a character phrase; the other names both a date and a deliverable, so it is supported. The two plants are different sentences of different classes, so one revision cannot close both"
    reason: >-
      Unconfirmable by construction, the LGL-02 class. The sentence works only
      while it reads as an ordinary and slightly lazy line in a manager's
      draft; the vocabulary the heuristic wants ("unsupported", "character
      claim", "plants", "revision") is the vocabulary of a reader reviewing the
      draft rather than of the manager writing it. The character phrase itself
      is present, and the selection is recomputed in
      tests/drafted/hr-c1-drafted-screen.test.js from the character_claim_phrases
      and log_deliverables lists this spec ships, pinned at 1 against a stated
      population of 2 and asserted to sit on a different sentence from the
      frequency plant. Expected to be permanent.

  - artifact: HR-02
    feature: "every resume prints its own Candidate ID beside the Requisition ID and a Contact address: ca-001 and ca-002 for the two already interviewed, byte-equal to the frozen interview corpus, and ca-101 to ca-116 for the sixteen still pending, with ca-100 left unissued. No candidate id is an employee id, no candidate name is a roster name or a canon name, no candidate surname is one the roster draws on, and every Contact address sits at one reserved example domain that is not the company's own"
    reason: >-
      Structural, the HR-01 stale-owner class. The confirmable half of this
      line, the candidate id ranges and the metadata labels beside them, is in the
      resumes and matches. The half that cannot match is the collision rule set, which
      resolves against datasets/core/people-roster/people-roster.csv and
      canon/people.md, and the drafted heuristic reads neither: it reads only the
      markdown under artifacts/HR-02/. "employee id", "roster name", "canon name",
      "surname" and "reserved example domain" are all statements about other files,
      and no wording of them can ever appear in a candidate's own resume. The rules
      hold and are recomputed rather than asserted in
      tests/drafted/hr-c2-drafted-screen.test.js at HR-C2-T2, which generates CORE-04
      in process, parses the seated rows out of canon/people.md, and joins all
      eighteen candidate names and contact domains against both. Expected to be
      permanent.

  - artifact: HR-02
    feature: "1 graduation year: exactly one four-digit year token, a nineteen hundreds or two thousands year, exists across all eighteen resume bodies, where a body is the text from the first section heading onward and the metadata block is therefore excluded, and that token sits inside its own resume's education section. Dropping the metadata exclusion returns 18, because every metadata block carries an ISO application date, so a brief that states the count states the exclusion with it"
    reason: >-
      Unconfirmable by construction, the LGL-02 class. Finding the year and
      recomputing the score without it is the whole of the bias eval this resume
      exists for, so a resume carrying the words "graduation year", "four-digit
      token", "metadata block" or "exclusion" would hand module 15 its answer and
      there would be nothing left to find. The year itself is present and the rule is
      mechanical: tests/drafted/hr-c2-drafted-screen.test.js pins the count at 1
      across the eighteen resume bodies, asserts the token sits inside its own
      resume's education section, and pins the qualifier-free count at 18 by dropping
      the metadata exclusion. Which resume it is stays in the private label set keyed
      to the data-pack tag. No rewording can make this checkable from the prose, so
      this entry is expected to be permanent.

  - artifact: HR-02
    feature: "age_route_lexemes is the closed list the corpus is swept against and returns zero hits on, matched on word boundaries: date of birth, DOB, born, birth year, birthday, years old, age, aged. Total stated experience on every resume sits inside a 4 to 12 year band, so career length gives a floor rather than an age, and the graduation year is the only inference route the corpus leaves open. That no narrative route exists either, no decade, no cohort, no period of national service and no role title that dates its holder, is certified by the freeze review, because a word list cannot see it"
    reason: >-
      Confirming this feature would mean the corpus had failed. It is the
      FIN-14 and HR-01 exclusion-list case exactly: a closed list is the rule set a
      reviewer sweeps with, not a description of the documents, and by construction
      all eight lexemes must appear nowhere in the eighteen resumes. A heuristic that
      matched "date of birth", "years old" or "birthday" would be reporting that the
      corpus leaks the very inference route it was built to close. The rest of the
      line is an absence too: no decade, no cohort, no period of national service, no
      role title that dates its holder. The list is loaded from this spec entry and
      applied to every resume in tests/drafted/hr-c2-drafted-screen.test.js at
      HR-C2-T3, which also parses every duration and pins the summed experience of all
      eighteen inside the stated band. The narrative leg is certified by the freeze
      review, and the line says so on its face. Expected to be permanent.

  - artifact: HR-02
    feature: "1 missing required field: exactly one resume lacks one of the six fields the screening rubric names in required_resume_fields, and the field it lacks is one a weighted criterion draws its evidence from, so the resume scores incomplete rather than merely short. Six resumes are missing a section the corpus otherwise carries, because five omit the optional certifications section, so a rule that counts a missing section returns 6 and only the required-field rule returns 1. The two selections sit on different resumes and both of those resumes carry pending screen"
    reason: >-
      A plant and an absence, and unconfirmable on both counts. The whole
      feature is that one resume is missing a section every other resume carries, and
      a keyword count cannot see a missing section; a resume that said "missing",
      "incomplete" or "required field" would have filled the gap with an explanation
      and the edge eval it exists for would have no Given left. The five certifications
      omissions that make the distractor six are the same kind of absence. The
      structure is present and recomputed in tests/drafted/hr-c2-drafted-screen.test.js
      at HR-C2-T4, which reads required_resume_fields out of the HR-04 spec entry,
      applies all six field rules to all eighteen resumes, pins the selection at 1
      against a stated distractor of 6, confirms the missing field feeds a weighted
      criterion, and asserts that the two HR-02 selections sit on different resumes and
      both carry the pending status. Expected to be permanent.

  - artifact: HR-02
    feature: "the two resumes for the already-interviewed candidates are drafted against their own frozen transcripts: no duration, technology or role claim contradicts a claim that candidate makes there, and each summed experience is at least as long as the largest single-technology claim the frozen corpus records for that candidate. Which paraphrase answers to which turn is certified by the freeze review rather than by a test, because a paraphrase is not mechanical"
    reason: >-
      Structural, and half of it is review-certified rather than mechanical.
      The rule is a consistency claim between artifacts/HR-02/ and the frozen
      artifacts/HR-03/ transcripts, and the drafted heuristic reads only the markdown
      under the artifact directory it is checking, so "transcripts", "contradicts" and
      "single-technology claim" are words about another set that no resume would carry.
      The mechanical leg, that each summed experience covers the largest
      single-technology claim the frozen corpus records, is recomputed against parsed
      durations in tests/drafted/hr-c2-drafted-screen.test.js at HR-C2-T3. The
      paraphrase leg is certified by the freeze review, which this line states on its
      own face rather than leaving to a reader. Expected to be permanent.

  - artifact: HR-04
    feature: "interview-question-bank.json states bank_id, as_of, source_artifact, competency_source, protected_characteristic_probe_list, panel_roles and questions in that order, at an as-of of 2026-04-03 byte-equal to the frozen register's own. questions is 37 objects running QST-0001 upward in file order, each stating question_id, competency_id, question_text, follow_up, question_type and panel_role in that order, three on every competency of the frozen twelve-entry library and one more on a single competency, so all twelve are covered and all 37 map to a competency the library actually carries. panel_roles is exactly three objects of panel_role, competency_ids and question_ids for recruiter-screen, hiring-manager and staff-engineer, whose competency_ids are byte-equal to the competency sets the frozen interview corpus already publishes: recruiter-screen assesses CMP-04 and CMP-05, hiring-manager assesses CMP-01, CMP-03 and CMP-05, staff-engineer assesses CMP-01, CMP-02 and CMP-03. A question carrying a panel role names one of the three and its own competency sits in that role's set, each entry's question_ids is exactly the set of questions carrying it, and a question on a competency no panel here assesses carries an empty panel role"
    reason: >-
      Structural, the HR-01 stale-owner class in its strongest form: the
      rule resolves entirely inside interview-question-bank.json, and the keyword
      heuristic reads only the markdown sources under artifacts/HR-04/, which are the
      six scorecards. bank_id, competency_source, question_text, follow_up,
      question_type and panel_role are JSON keys, and a scorecard would never print
      one. No wording of this line can ever match, and rewording it to the scorecards'
      vocabulary would make it describe the wrong file. The structure is asserted
      rather than trusted in tests/drafted/hr-c2-drafted-screen.test.js, which pins the
      top-level key order, the per-question key order, the QST-0001 file order, the
      thirty-seven count, three questions on each of the twelve library competencies
      with one competency carrying a fourth, and the three panel-role competency sets
      byte-equal to the frozen HR-03 transcripts (HR-C2-T6 and HR-C2-T7). Expected to
