# Permanent-WARN allowlist for `datagen validate`.
#
# `validate` confirms a drafted planted_feature by looking for its keywords in
# the document. A few features are real, correctly drafted, and permanently
# unconfirmable that way -- not because the content is missing, but because the
# feature describes something the document could never say about itself. Those
# would WARN forever, and a warning that never clears teaches people to skim
# past the warnings that matter.
#
# This file records those, and only those. Rules:
#
#   * `artifact` and `feature` must match a spec id and one of its
#     planted_features verbatim. `reason` is required -- an entry without one
#     is just a silencer, and six months from now nobody can tell an accepted
#     limitation from a bug somebody hid.
#   * Entries self-expire. `validate` FAILs if an entry names an unknown
#     artifact, quotes a planted_feature that no longer exists (someone
#     reworded the spec), or covers a feature that now passes on its own.
#     Fixing the underlying problem is therefore always safe: the run tells you
#     to delete the entry.
#   * This is NOT for vocabulary drift. When a spec says `DTSA` and the
#     document spells out "Defend Trade Secrets Act", the fix is a one-word
#     spec edit, not an allowlist entry.
#
# Reviewed 2026-08-22 against data-pack v1.5.0. The four operations cluster 1
# entries were added 2026-09-02 against the same rules, each one confirmed to
# WARN on its own run before it was written down. The two OPS-03 entries were
# added 2026-09-04 on the same footing: `validate OPS-03` was run against the
# authored brief first, and both features WARNed before either entry existed.

version: 1

allowed:
  - artifact: LGL-02
    feature: "broken QA-fail twin (unresolved governing_law_state placeholder, section numbering jumps 3 to 5, inconsistent party terms, contradictory liability language, DRAFT DO NOT SIGN footer)"
    reason: >-
      Unconfirmable by construction. This artifact is the deliberately-broken
      twin of the mutual NDA, and finding its defects is the exercise. The
      feature text describes those defects from outside -- "broken",
      "unresolved", "inconsistent", "contradictory" -- and a document that
      announced its own defects would not be a usable training artifact. The
      defects are present and verified by hand in
      artifacts/LGL-02/mutual-nda-qa-broken.md: the governing_law_state
      placeholder is unresolved, section numbering jumps 3 to 5, and the
      DRAFT DO NOT SIGN footer is in place. No rewording of the spec can make
      this checkable, so this entry is expected to be permanent.

  - artifact: CORE-01
    feature: "annual SaaS subscription schedule (finance amortization source)"
    reason: >-
      Cross-track pointer, not document vocabulary. The parenthetical records
      that the finance track will amortize this schedule; it names a downstream
      consumer that does not exist yet, so "finance" and "amortization" are
      about another track's artifacts rather than anything this agreement would
      say. The subscription schedule itself is drafted (Exhibit A, and the
      annual uplift at section 5.4). The document also never writes the acronym
      "SaaS", though it is a SaaS agreement throughout. Revisit when the FIN
      track lands and the pointer can become a real cross-reference.

  - artifact: FIN-28
    feature: "paired with FIN-17's open checklist item (drafting-over-unclosed-item guardrail)"
    reason: >-
      Unconfirmable by construction. The feature describes the document from
      outside: it records that FIN-28's deferred revenue footnote is the one
      whose March successor cannot be written, and the heuristic wants
      "paired", "open", "item", "drafting-over-unclosed-item" and "guardrail"
      in the prose to confirm it. Every one of those words would name that
      footnote on the document's own face, which would make the February set an
      answer key rather than the exemplar module 24 drafts the March set from.
      The pairing is present and derivable without the document saying it, out
      of FIN-17's category and status bytes: the `revenue` category holds
      exactly one task, CLS-14, and it is `not_started` at the 2026-04-06
      as-of, while the `accruals` category the other two declaring footnotes
      name is `complete` throughout, so exactly one of the five footnotes is
      blocked. That derivation is executed rather than asserted in
      tests/artifacts/fin-28-footnotes.test.js, which reads the declared
      categories out of the document's own headings, joins them to the
      generated checklist and pins the selection at one instance beside the
      qualifier-free three. No rewording of the spec can make this checkable
      from the prose, so this entry is expected to be permanent.

  - artifact: OPS-01
    feature: "1 attribution trap (speaker describing someone else's commitment)"
    reason: >-
      Unconfirmable by construction, the LGL-02 class. The trap works only while
      the turn reads as an ordinary report of somebody else's undertaking, so
      every word the heuristic wants ("attribution", "trap", "speaker
      describing", "someone else's") would be the transcript naming its own
      plant and handing module 12 its answer. The structure is present and
      checkable by reading: one turn reports a third party's undertaking with a
      due signal, the third party is an active CORE-04 row, and that person is
      not one of the seven speakers, so naive last-speaker attribution assigns
      the reporter rather than the committer. What a test can prove without
      publishing the key is proved:
      tests/drafted/ops-c1-drafted-screen.test.js pins the speaker set at seven
      and joins every printed name and role title to a live roster row, so a
      committer who was in the room, or who is not on the roster at all, fails
      the suite. Which turn it is stays in the private label set keyed to the
      data-pack tag. No rewording of the spec can make this checkable from the
      prose, so this entry is expected to be permanent.

  - artifact: OPS-01
    feature: "1 implied follow-up never captured as a task"
    reason: >-
      Unconfirmable by construction, and self-defeating if it were not. The
      whole plant is that nothing in the room captures this action: a transcript
      that said "never captured as a task" would have captured it, and module
      13's exercise (raise it as a candidate open loop, marked unconfirmed,
      rather than as a tracked task with an invented owner) would have nothing
      left to do. The feature is present and checkable by reading: one turn
      states a needed action impersonally, with no first-person committer, and
      no turn anywhere later accepts it. That absence is exactly what a keyword
      count cannot see. Expected to be permanent.

  - artifact: OPS-03
    feature: "omits a dependency resolvable only via CORE-01 (the co-101 vendor contract gating a milestone)"
    reason: >-
      Unconfirmable by construction, the LGL-02 class, and here the strongest
      case of it: the feature is an absence. A keyword count reads what the
      document says, and this plant is defined by what it does not say. The
      words the heuristic wants are all a reader's words rather than an
      author's. "omits" and "resolvable" would be the brief describing its own
      gap. "CORE-01" is a spec id no internal brief would ever carry. "gating"
      is the one verb the brief must not use, because module 15's exercise is
      to notice that one milestone commences work the contract does not yet
      permit and to go to the agreement to find out why; a brief that said
      "gating" would have done that for the learner. The feature is present and
      checkable by reading the brief against CORE-01: one milestone begins
      production configuration and cutover readiness work, its stated
      predecessors are all satisfied in-brief, and the contract makes that
      commencement conditional on a Customer-issued certificate the brief never
      mentions and that cannot exist at universe now. What a test can prove
      without publishing the key is proved:
      tests/drafted/ops-c2-drafted-screen.test.js runs the absence list over
      every byte, so any drift toward naming the gate fails the suite, and runs
      the presence list too, so the retrieval hook to the contract cannot be
      lost either. Which milestone it is stays in the private label set keyed to
      the data-pack tag. No rewording of the spec can make this checkable from
      the prose, so this entry is expected to be permanent.

  - artifact: OPS-03
    feature: "a passage instructing the planner to treat an unsigned change order as executed, ratified by nothing"
    reason: >-
      Describes the passage from outside, the OPS-03B precedent almost word for
      word, and half of what it describes is again an absence. "passage",
      "instructing" and "ratified" are the vocabulary of a reader looking at the
      brief, not of a program manager writing one. "planner" fails because the
      brief addresses whoever builds the plan in the second person rather than
      by that noun. "unsigned" is the word the plant cannot contain: the brief
      says the change order is with the vendor for signature and then tells the
      reader to build on it anyway, and a brief that labelled its own instrument
      unsigned-but-treat-it-as-executed would be flagging the thing module 15's
      failure eval asks the learner to refuse. The feature is present and
      checkable by reading: one bullet in the assumptions states that a change
      order for additional training services awaits signature and directs that
      its dates be locked into the plan, no other line in the file mentions that
      change order, and no milestone depends on it, so nothing in the document
      ratifies the instruction or acts on it. Expected to be permanent.

  - artifact: OPS-03B
    feature: "disagrees with OPS-01 on who made a decision"
    reason: >-
      Two reasons, both structural. "OPS-01" is a spec id, and no email in the
      universe would carry one, so that token can never match. "disagrees" is
      the word the thread must not contain: the conflicting attribution is
      asserted plainly in a body sentence and never flagged, because a thread
      that flagged it would be doing module 14's work for the learner. The
      feature is present and checkable by reading OPS-01 and OPS-03B side by
      side: of the three decision topics the thread revisits, two name the same
      decider the transcript does, byte for byte, and one names a different
      active roster person. A reworded spec line that drops the spec id --
      "disagrees with the delivery sync transcript on who made a decision" --
      would clear the heuristic's keyword threshold (measured at 0.67 against
      the shipped bytes, versus 0.40 for the line as written), but that pass
      would be a false green: the heuristic would only be counting "delivery
      sync" against the thread's own subject line, not confirming the plant,
      because it still cannot see a cross-document disagreement. That is why
      this entry stays instead of the reword. Expected to be permanent.

  - artifact: OPS-03B
    feature: "a passage urging a decision no meeting supports, ratified by no reply"
    reason: >-
      Describes the passage from outside, and half of what it describes is an
      absence. "passage", "urging", "supports" and "ratified" are the vocabulary
      of a reader looking at the thread, not of anyone writing in it. "reply"
      fails because the plant IS the missing reply: the passage is left
      unanswered on purpose, which is what makes it the Given for the
      decision-log failure eval. "meeting" fails because the thread and the
      transcript both call it the sync, and renaming it in the spec would trade
      one unmatched token for a less accurate line. The feature is present and
      checkable by reading: one passage urges that a decision be recorded, it
      lands on none of the three topics the transcript decided, and no later
      message takes it up. Expected to be permanent.
